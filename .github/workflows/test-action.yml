name: Fork, branch, commit, and raise a PR via a GITHUB_PAT

on:
  push:
  workflow_dispatch:

jobs:


  Fork_branch_commit_raise_PR_as_machine_account:
    if: ${{ github.actor == github.repository_owner || github.actor == 'JamesParrott' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Standard repository read access
    steps:
      - name: Ensure user instigating the workflow owns the org that owns the repo.
        uses: actions/github-script@v9
        with:
          # Oganization permissions: Read access to members 
          github-token: ${{ secrets.READ_ORG_MEMBERS_PAT }}
          script: |
            const org = context.repo.owner;
            const username = context.actor;

            // try {
            const { data: membership } = await github.rest.orgs.getMembershipForUser({
              org: org,
              username: username
            });

            if (membership.role === 'admin' && membership.state === 'active') {
              console.log(`✅ User ${username} is an active Owner (admin) of ${org}.`);
            } else {
              core.setFailed(`❌ User ${username} is not an owner of ${org}. Role: ${membership.role}`);
            }
            // } catch (err) {
            //  core.setFailed(`Failed to verify org membership for ${username}: ${err.message}`);
            // }
      - name: Orchestrate Fork, Commit, and PR Test
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MACHINE_ACCOUNT_PAT_3 }}
          script: |
            const targetOwner = 'JamesParrott';
            const targetRepo = '__dummy_test_repo';
            const branchName = `test-branch-${Date.now()}`;
            const filePath = 'test-file.txt';

            // ---------------------------------------------------------------------
            // i) CREATE A FORK OF THE DUMMY REPO
            // ---------------------------------------------------------------------
            console.log(`Forking ${targetOwner}/${targetRepo}...`);
            const { data: fork } = await github.rest.repos.createFork({
              owner: targetOwner,
              repo: targetRepo,
              default_branch_only: true
            });

            const forkOwner = fork.owner.login;
            const forkRepo = fork.name;

            // Wait a few seconds for GitHub to finish provisioning the fork
            console.log(`Fork created: ${forkOwner}/${forkRepo}. Waiting for sync...`);
            await new Promise(resolve => setTimeout(resolve, 5000));

            // ---------------------------------------------------------------------
            // ii) MAKE A NEW BRANCH ON THE FORK
            // ---------------------------------------------------------------------
            // Fetch the default branch commit SHA from the base repository
            const { data: baseRepo } = await github.rest.repos.get({
              owner: targetOwner,
              repo: targetRepo
            });
            const defaultBranch = baseRepo.default_branch;

            const { data: refData } = await github.rest.git.getRef({
              owner: targetOwner,
              repo: targetRepo,
              ref: `heads/${defaultBranch}`
            });
            const baseSha = refData.object.sha;

            console.log(`Creating branch '${branchName}' on fork off SHA ${baseSha}...`);
            await github.rest.git.createRef({
              owner: forkOwner,
              repo: forkRepo,
              ref: `refs/heads/${branchName}`,
              sha: baseSha
            });

            // ---------------------------------------------------------------------
            // iii) CREATE A NOMINAL CHANGE & COMMIT ON THE FORK
            // ---------------------------------------------------------------------
            const contentEncoded = Buffer.from(`Test automated commit at ${new Date().toISOString()}`).toString('base64');

            console.log(`Creating test file commit on '${branchName}'...`);
            await github.rest.repos.createOrUpdateFileContents({
              owner: forkOwner,
              repo: forkRepo,
              path: filePath,
              message: 'test: automated commit for integration test',
              content: contentEncoded,
              branch: branchName
            });

            // ---------------------------------------------------------------------
            // iv) RAISE A PR FROM FORK TO PARENT DUMMY REPO
            // ---------------------------------------------------------------------
            console.log(`Raising PR from ${forkOwner}:${branchName} to ${targetOwner}:${defaultBranch}...`);
            const { data: pr } = await github.rest.pulls.create({
              owner: targetOwner,
              repo: targetRepo,
              title: `[Automated Test] PR from ${forkOwner}`,
              head: `${forkOwner}:${branchName}`,
              base: defaultBranch,
              body: 'This is an automated test PR generated to verify the NotTodayThankyou action.'
            });

            console.log(`🎉 Test PR successfully created: ${pr.html_url} (PR #${pr.number})`);